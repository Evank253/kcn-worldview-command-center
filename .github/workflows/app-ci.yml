name: Command Center App CI

on:
  push:
    branches: [Python-3, main]
    paths:
      - 'app/**'
      - '.github/workflows/app-ci.yml'
  pull_request:
    branches: [Python-3, main]
    paths:
      - 'app/**'
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: [test-and-build]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: false
          tags: kcn-command-center-web:ci

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile.server
          push: false
          tags: kcn-command-center-server:ci
